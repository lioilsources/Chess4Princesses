    max_moves: 1
  - goal: escape_check
    escape: capture
    prompt: {cs: "Vezmi! Motýlek sebere zlobivou Věž.", en: "Take! The butterfly captures the naughty rook."}
    fen: "4r2k/8/8/1B6/8/8/8/4K3 w - - 0 1"
    max_moves: 1
  - goal: escape_check
    prompt: {cs: "Zachraň Krále, jak chceš.", en: "Save the king any way you like."}
    fen: "7k/8/8/8/1q6/8/8/R3K3 w - - 0 1"
    max_moves: 1

    fen: "4r2k/8/8/8/8/8/8/4K3 w - - 0 1"
    max_moves: 1
  - goal: escape_check
    escape: block
    prompt: {cs: "Zakryj! Postav Věžku do cesty.", en: "Block! Put the rook in the way."}

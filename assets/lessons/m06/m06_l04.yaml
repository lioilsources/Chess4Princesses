id: m06_l04
module: 6
title: {cs: "Zachraň Krále!", en: "Save the king!"}
story:
  cs: "Když je Král v šachu, musí se hned zachránit. Jsou tři způsoby: uteč, zakryj, nebo vezmi."
  en: "When the king is in check, he must be saved right away. There are three ways: run, block, or take."
skills: [escape_check]
rules: full
hints:
  - {after_fails: 1, highlight: legal_moves}
  - {after_fails: 3, highlight: solution_first_move}
tasks:

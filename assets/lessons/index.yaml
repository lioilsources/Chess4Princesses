# Kingdom map: modules as islands (PLAN §1). Lessons are listed in play order;
# a module without lessons is shown as "coming soon".
modules:
  - module: 0
    title: {cs: "Království", en: "The Kingdom"}
    icon: castle
    unlock: queen
    lessons: [m00_l01, m00_l02, m00_l03]
